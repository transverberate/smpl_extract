[build-system]
requires = ["setuptools>=61.0.0", "cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smpl-extract"
version = "0.3.0"
description = "Extract samples and tracks from AKAI, Roland S-7xx, and CDDA sampler/audio disc images."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Counselor Chip" },
]
keywords = [
    "90s sample CD",
    "sampler",
    "AKAI",
    "Roland S-770",
    "Roland S-7xx",
    "CDDA",
    "sample CD",
    "disk image",
    "wav extraction",
    "S1000",
    "S3000",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Utilities",
]
dependencies = [
    "construct",
    "future",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/transverberate/smpl_extract"
Repository = "https://github.com/transverberate/smpl_extract"
Issues = "https://github.com/transverberate/smpl_extract/issues"

[project.scripts]
smpl-extract = "smpl_extract.__main__:main"

[tool.setuptools.packages.find]
include = ["smpl_extract*"]


[tool.setuptools.package-data]
smpl_extract = ["py.typed"]
